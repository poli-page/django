[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "django-poli-page"
dynamic = ["version"]
description = "Django reusable app for the Poli Page PDF rendering API"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [{ name = "Poli Page" }]
keywords = ["pdf", "html", "template", "rendering", "poli-page", "django"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    "django>=4.2",
    "poli-page>=0.9,<2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
    "pytest-mock>=3.12",
    "ruff>=0.6",
    "mypy>=1.10",
    "django-stubs[compatible-mypy]>=5.0",
    "respx>=0.21",
    "build>=1",
    "twine>=5",
]

[project.urls]
Homepage = "https://poli.page"
Documentation = "https://docs.poli.page/reference/sdk/python/"
Source = "https://github.com/poli-page/django"
Issues = "https://github.com/poli-page/django/issues"
Changelog = "https://github.com/poli-page/django/blob/main/CHANGELOG.md"

[tool.uv.sources]
# poli-page isn't on PyPI yet. Pin uv to the sdk-python commit that dropped
# template versions and render preview; replace with the release once published.
poli-page = { git = "https://github.com/poli-page/sdk-python", rev = "f47d94d78f1d6c14232c7ad8c6522d753041d125" }

[tool.hatch.version]
source = "regex"
path = "src/django_poli_page/_version.py"
pattern = '__version__ = "(?P<version>[^"]+)"'

[tool.hatch.build.targets.wheel]
packages = ["src/django_poli_page"]

[tool.hatch.build.targets.sdist]
include = [
    "/src",
    "/tests",
    "/README.md",
    "/CHANGELOG.md",
    "/LICENSE",
    "/pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "RUF", "SIM", "DJ"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["DJ", "B017"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["mypy_django_plugin.main"]
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = "tests.*"
disallow_untyped_decorators = false

[tool.django-stubs]
django_settings_module = "tests.settings"

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = ["."]
python_files = ["test_*.py"]
testpaths = ["tests"]
markers = ["integration: hits the live API; requires POLI_PAGE_API_KEY"]
