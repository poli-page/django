[project]
name = "django-poli-page-example"
version = "0.0.0"
description = "Example Django project demonstrating django-poli-page."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "django-poli-page",
    "poli-page>=0.9,<2",
]

[tool.uv.sources]
# The integration always installs from the parent checkout.
django-poli-page = { path = "..", editable = true }
# poli-page is not on PyPI yet: same pinned sdk-python commit as the package.
poli-page = { git = "https://github.com/poli-page/sdk-python", rev = "f47d94d78f1d6c14232c7ad8c6522d753041d125" }
