[project]
name = "django-poli-page-example"
version = "0.0.0"
description = "Example Django project demonstrating django-poli-page."
requires-python = ">=3.11"
dependencies = [
    "django>=5.0",
    "django-poli-page",
    "poli-page>=0.11.0,<2",
]

[tool.uv.sources]
# The integration always installs from the parent checkout.
django-poli-page = { path = "..", editable = true }

[dependency-groups]
# The contract test (tests/test_contract.py) runs the app under pytest-django.
dev = [
    "pytest>=8",
    "pytest-django>=4.8",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "example_project.settings"
pythonpath = ["."]
testpaths = ["tests"]
