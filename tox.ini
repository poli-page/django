[tox]
envlist =
    py311-dj{42,50,51,52},
    py312-dj{42,50,51,52,60},
    py313-dj{50,51,52,60}
isolated_build = true

[testenv]
deps =
    pytest>=8
    pytest-django>=4.8
    pytest-mock>=3.12
    dj42: django~=4.2.0
    dj50: django~=5.0.0
    dj51: django~=5.1.0
    dj52: django~=5.2.0
    dj60: django~=6.0.0
commands =
    pytest tests/unit -v
setenv =
    DJANGO_SETTINGS_MODULE = tests.settings
    PYTHONPATH = {toxinidir}/src

[gh-actions]
python =
    3.11: py311
    3.12: py312
    3.13: py313
